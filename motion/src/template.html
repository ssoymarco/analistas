<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Analistas — El escudo es el dato</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0D1F35; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D1F35;
           font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
  #main { position: absolute; left: 0; top: 0; overflow: visible; }
  #main text { font-family: 'Montserrat', sans-serif; font-weight: 900; }
  /* 3D layer */
  #persp { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 2400px; perspective-origin: 540px 960px; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-style: preserve-3d; transform-origin: 0 0; }
  .box { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .f { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #floor { position: absolute; left: 0; top: 0; height: 4px; background: rgba(255,255,255,0.3); transform-origin: 50% 50%; }
  /* UI layer */
  #ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #ui div { position: absolute; box-sizing: border-box; }
  .lbl { color: #FFFFFF; font-weight: 800; white-space: nowrap; text-transform: uppercase; }
  .flexc { display: flex; align-items: center; justify-content: center; }
  .pill { height: 72px; width: 144px; border-radius: 36px; display: flex; align-items: center; justify-content: center;
          font-weight: 900; font-size: 44px; }
</style>
</head>
<body>
<div id="stage">
  <div id="persp"><div id="world"></div></div>
  <div id="ui"></div>
  <svg id="main" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="root"></g>
  </svg>
  <canvas id="fx" width="1080" height="1920" style="position:absolute;left:0;top:0"></canvas>
</div>

<script>
/* =====================================================================
   ANALISTAS — "El escudo es el dato"
   10 s · 120 BPM · 1080x1920. Every visual property is a pure function
   of t inside window.seek(t). No CSS animations, timers or frame state.
   ===================================================================== */
const LOGO_SUBPATHS = %%LOGO_SUBPATHS%%;

const W = 1080, H = 1920, DUR = 10, BEAT = 0.5;
const NAVY = '#0D1F35', BLUE = '#3B82F6', RED = '#EF4444', WHITE = '#FFFFFF', BLACK = '#000000';
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------------- easing & time helpers (all functions of time) ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, t0, d) => clamp((t - t0) / d);
const E10 = 1 - Math.pow(2, -10);
const expoOut = p => p <= 0 ? 0 : p >= 1 ? 1 : (1 - Math.pow(2, -10 * p)) / E10;
const expoIn = p => p <= 0 ? 0 : p >= 1 ? 1 : (Math.pow(2, 10 * p) - 1) / 1023;
const expoInOut = p => p <= 0 ? 0 : p >= 1 ? 1 : (p < 0.5 ? expoIn(2 * p) / 2 : 0.5 + expoOut(2 * p - 1) / 2);
const cubicInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const cubicIn = p => p * p * p;
const smooth = p => p * p * (3 - 2 * p);
// critically damped spring (no overshoot, no bounce): 0 -> 1
const spring = (t, t0, w = 26) => { const x = t - t0; return x <= 0 ? 0 : 1 - (1 + w * x) * Math.exp(-w * x); };
// numeric derivative of any f(t)
const H_D = 1 / 240;
const vel = (f, t) => (f(t + H_D) - f(t - H_D)) / (2 * H_D);
// motion blur from speed (px/s) -> px
const mb = (v, k = 0.0042, cap = 40) => Math.min(cap, Math.abs(v) * k);

/* ---------------- temporal smear (motion blur along the true path) ----------------
   For the fastest moves, K samples spread over one subframe interval are drawn
   additively at 1/K each: an exact average, i.e. a 360° shutter that follows
   rotation and zoom. Combined with the 3 tmix subframes it leaves no ghosts. */
const SUBDT = 1 / 180, SMEAR_K = 12;
let FX = null, FXO = null;
function smear(t, drawAt, K = SMEAR_K) {
  for (let k = 0; k < K; k++) {
    const tk = t + ((k + 0.5) / K - 0.5) * SUBDT;
    FXO.setTransform(1, 0, 0, 1, 0, 0); FXO.clearRect(0, 0, W, H);
    drawAt(FXO, tk);
    FX.save(); FX.setTransform(1, 0, 0, 1, 0, 0);
    FX.globalCompositeOperation = 'lighter'; FX.globalAlpha = 1 / K;
    FX.drawImage(FXO.canvas, 0, 0); FX.restore();
  }
}
function fillPoly(ctx, P) { ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i][0], P[i][1]); ctx.closePath(); }

/* ---------------- DOM helpers ---------------- */
const $ = id => document.getElementById(id);
function S(tag, attrs = {}, parent = null, text = null) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function D(parent, style = {}, text = null, cls = null) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  Object.assign(e.style, style);
  if (text !== null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const show = (e, on) => { e.style.display = on ? '' : 'none'; };
const sshow = (e, on) => e.setAttribute('display', on ? 'inline' : 'none');
// SVG blur filters (directional: sx, sy)
const filters = {};
function mkFilter(id) {
  const f = S('filter', { id, filterUnits: 'userSpaceOnUse', x: -1200, y: -1200, width: 3480, height: 4320,
                          'color-interpolation-filters': 'sRGB' }, $('defs'));
  filters[id] = S('feGaussianBlur', { stdDeviation: '0 0' }, f);
  return id;
}
function blurSVG(el, id, sx, sy) {
  if (sx < 0.25 && sy < 0.25) { el.removeAttribute('filter'); return; }
  filters[id].setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);
  el.setAttribute('filter', `url(#${id})`);
}
function blurHTML(el, id, sx, sy) {
  if (sx < 0.25 && sy < 0.25) { el.style.filter = 'none'; return; }
  filters[id].setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);
  el.style.filter = `url(#${id})`;
}
function mkClip(id, x, y, w, h, units) {
  const c = S('clipPath', { id }, $('defs'));
  if (units) c.setAttribute('clipPathUnits', units);
  return S('rect', { x, y, width: w, height: h }, c);
}

/* ---------------- geometry: polygons & morphing ---------------- */
function polyArea(P) { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
function centroid(P) { let x = 0, y = 0; for (const p of P) { x += p[0]; y += p[1]; } return [x / P.length, y / P.length]; }
// corner-preserving resample of a closed polygon to N points
function resample(pts, N) {
  const n = pts.length, L = [];
  let tot = 0;
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(l); tot += l; }
  const cnt = L.map(l => Math.max(1, Math.round(N * l / tot)));
  let sum = cnt.reduce((a, b) => a + b, 0);
  while (sum !== N) {
    // adjust on longest edges
    let bi = 0; for (let i = 1; i < n; i++) if ((sum > N ? cnt[i] > 1 : true) && L[i] / cnt[i] * (sum > N ? -1 : 1) > L[bi] / cnt[bi] * (sum > N ? -1 : 1)) bi = i;
    if (sum > N) { let mi = -1; for (let i = 0; i < n; i++) if (cnt[i] > 1 && (mi < 0 || L[i] / cnt[i] < L[mi] / cnt[mi])) mi = i; cnt[mi]--; sum--; }
    else { let mi = 0; for (let i = 1; i < n; i++) if (L[i] / cnt[i] > L[mi] / cnt[mi]) mi = i; cnt[mi]++; sum++; }
  }
  const out = [];
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; for (let k = 0; k < cnt[i]; k++) { const u = k / cnt[i]; out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); } }
  return out;
}
// orient clockwise (screen, y-down => positive area) and start at the "12 o'clock" point
function align(P) {
  let Q = P.slice();
  if (polyArea(Q) < 0) Q.reverse();
  const c = centroid(Q);
  let bi = 0, bd = 1e9;
  for (let i = 0; i < Q.length; i++) {
    const a = Math.atan2(Q[i][1] - c[1], Q[i][0] - c[0]);
    let d = Math.abs(a + Math.PI / 2); if (d > Math.PI) d = 2 * Math.PI - d;
    if (d < bd) { bd = d; bi = i; }
  }
  return Q.slice(bi).concat(Q.slice(0, bi));
}
const rot = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
// Build a morph from polygon A (source) to polygon B (target), with B arriving rotated by theta.
function makeMorph(A, B, theta = 0, N = 160) {
  const cA = centroid(A), cB = centroid(B);
  const Al = align(resample(A.map(p => [p[0] - cA[0], p[1] - cA[1]]), N));
  const Bl = align(resample(B.map(p => rot([p[0] - cB[0], p[1] - cB[1]], -theta)), N));
  return { Al, Bl, cA, cB, theta };
}
function morphAt(M, pShape, pRot = pShape, pPos = pShape, cBOverride = null) {
  const cB = cBOverride || M.cB, a = M.theta * pRot;
  const cx = lerp(M.cA[0], cB[0], pPos), cy = lerp(M.cA[1], cB[1], pPos);
  const out = new Array(M.Al.length);
  for (let i = 0; i < M.Al.length; i++) {
    const x = lerp(M.Al[i][0], M.Bl[i][0], pShape), y = lerp(M.Al[i][1], M.Bl[i][1], pShape);
    const r = rot([x, y], a); out[i] = [r[0] + cx, r[1] + cy];
  }
  return out;
}
const pathOf = P => 'M' + P.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
const rectPoly = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function rrectPoly(x, y, w, h, r, seg = 10) {
  const P = []; r = Math.min(r, w / 2, h / 2);
  const corners = [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]];
  for (const [cx, cy, a0] of corners) for (let k = 0; k <= seg; k++) { const a = (a0 + 90 * k / seg) * Math.PI / 180; P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return P;
}

/* ---------------- logo geometry ---------------- */
// logo.svg is 733 x 949. Subpaths: 0 crown, 1 outer silhouette, 2-4 crown jewels, 5 inner field,
// 6-8 upper stripes, 9/22 band rules, 10-21 ANALISTAS letters, 23-25 lower stripes.
const LOGO_C = [371, 477];
// The three stripes rebuilt as native vector polygons (upper + lower halves joined, band drawn on top).
const STRIPES_LOGO = [
  [[139, 356.5], [229.5, 284], [233.5, 285], [236, 288.5], [237, 766.5], [233.5, 772], [229.5, 773], [224.5, 771], [158.5, 732], [138, 718.5]],
  [[322, 311.5], [339.5, 296], [367.5, 274], [373.5, 275], [419, 312.5], [419, 831.5], [399.5, 845.98], [377.5, 860], [369.5, 860.95], [362.5, 858.83], [322, 830.5]],
  [[507.63, 290.5], [508, 287.5], [512.5, 284], [516.5, 285], [605, 356.5], [604.65, 705.5], [519.5, 763.8], [514.5, 766], [509, 763.5], [507.13, 758.5]]
];
const mapLogo = (P, cx, cy, s) => P.map(p => [cx + s * (p[0] - LOGO_C[0]), cy + s * (p[1] - LOGO_C[1])]);
// End card placement
const END = { cx: 540, cy: 760, s: 0.8 };
const ENDZ_ORIGIN = [540, 910];
const endZoom = t => 1 - 0.035 * (1 - smooth(prog(t, 8.0, 1.95))); // settles exactly at 9.95 so the last frame == frame 0
function endMatrix(t) { // logo -> screen affine (a, d, e, f)
  const z = endZoom(t), s = END.s * z;
  const cx = ENDZ_ORIGIN[0] + (END.cx - ENDZ_ORIGIN[0]) * z, cy = ENDZ_ORIGIN[1] + (END.cy - ENDZ_ORIGIN[1]) * z;
  return { s, e: cx - s * LOGO_C[0], f: cy - s * LOGO_C[1] };
}
const applyM = (M, P) => P.map(p => [M.e + M.s * p[0], M.f + M.s * p[1]]);
function samplePath(d, N) {
  const p = S('path', { d }, $('defs'));
  const L = p.getTotalLength(), out = [];
  for (let i = 0; i < N; i++) { const q = p.getPointAtLength(L * i / N); out.push([q.x, q.y]); }
  p.remove();
  return out;
}

/* ---------------- typography measurement ---------------- */
const cv = document.createElement('canvas').getContext('2d');
function meas(str, weight = 900) {
  cv.font = `${weight} 100px Montserrat`;
  const m = cv.measureText(str);
  return { aL: m.actualBoundingBoxLeft, aR: m.actualBoundingBoxRight, adv: m.width };
}
// font size + x so that the ink of `str` spans exactly [x0, x0+w]
function justify(str, x0, w, weight = 900) {
  const m = meas(str, weight); const fs = w * 100 / (m.aL + m.aR);
  return { fs, x: x0 + m.aL * fs / 100, m };
}
let CAP = 0.7;

/* =====================================================================
   SCENE BUILD (once). Layout constants are computed here; seek(t) never
   reads anything it wrote in a previous frame.
   ===================================================================== */
const G = {};
async function build() {
  await document.fonts.load('900 100px Montserrat');
  await document.fonts.load('800 100px Montserrat');
  await document.fonts.load('700 100px Montserrat');
  await document.fonts.ready;
  cv.font = '900 100px Montserrat';
  CAP = cv.measureText('H').actualBoundingBoxAscent / 100;

  const root = $('root');
  ['fGOL', 'fES', 'fAL', 'fINST', 'fCNT', 'fLG0', 'fLG1', 'fLG2', 'fLG3', 'fLG4', 'fM0', 'fM1', 'fM2',
   'fEND', 'fTG0', 'fTG1', 'fTG2', 'fNEWS', 'fUIC', 'fSCORE', 'fE0', 'fE1', 'fE2', 'fRING'].forEach(mkFilter);

  /* ---------- BAR 1 : hook + kinetic type ---------- */
  const X0 = 90, TW = 900;
  G.jGOL = justify('GOL', X0, TW);
  G.jL1 = justify('GOLES', X0, TW);
  G.jAL = justify('AL', X0, TW);
  G.jIN = justify('INSTANTE', X0, TW);
  G.advGOL = meas('GOL').adv;
  G.gap = 44;
  const c1 = CAP * G.jL1.fs, c2 = CAP * G.jAL.fs, c3 = CAP * G.jIN.fs, cA = CAP * G.jGOL.fs;
  G.topA = 960 - cA / 2; G.topB = 960 - c1 / 2;
  G.topC = 960 - (c1 + c2 + G.gap) / 2; G.topD = 960 - (c1 + c2 + c3 + 2 * G.gap) / 2;

  G.t1 = S('g', {}, root);
  // live counter
  G.cntAnchor = S('g', {}, G.t1);
  mkClip('cntClip', 60, -110, 600, 140);
  const cntClipG = S('g', { 'clip-path': 'url(#cntClip)' }, G.cntAnchor);
  G.cntRoll = S('g', {}, cntClipG);
  G.cntDot = S('circle', { cx: X0 + 16, cy: -23, r: 16, fill: RED }, G.cntRoll);
  mkClip('cntDigClip', 120, -80, 400, 100);
  const dg = S('g', { 'clip-path': 'url(#cntDigClip)' }, G.cntRoll);
  G.cntA = S('text', { x: 134, y: 0, 'font-size': 66, fill: WHITE, 'font-weight': 800 }, dg, "63'");
  G.cntB = S('text', { x: 134, y: 0, 'font-size': 66, fill: WHITE, 'font-weight': 800 }, dg, "64'");
  // GOL (red) + white wipe copy, ES
  G.gGOL = S('g', {}, G.t1);
  G.tGOLr = S('text', { x: 0, y: 0, 'font-size': 100, fill: RED }, G.gGOL, 'GOL');
  const wc = S('clipPath', { id: 'wipeGOL', clipPathUnits: 'objectBoundingBox' }, $('defs'));
  G.wipeRect = S('rect', { x: -0.05, y: -0.2, width: 0, height: 1.4 }, wc);
  G.tGOLw = S('text', { x: 0, y: 0, 'font-size': 100, fill: WHITE, 'clip-path': 'url(#wipeGOL)' }, G.gGOL, 'GOL');
  G.gES = S('g', {}, G.t1);
  S('text', { x: 0, y: 0, 'font-size': 100, fill: WHITE }, G.gES, 'ES');
  // AL in its slot
  G.alAnchor = S('g', {}, G.t1);
  mkClip('alClip', 0, -10, 1080, c2 + 20);
  const alc = S('g', { 'clip-path': 'url(#alClip)' }, G.alAnchor);
  G.gAL = S('g', {}, alc); S('text', { x: 0, y: 0, 'font-size': 100, fill: WHITE }, G.gAL, 'AL');
  G.gIN = S('g', {}, G.t1); S('text', { x: 0, y: 0, 'font-size': 100, fill: WHITE }, G.gIN, 'INSTANTE');
  G.c = [c1, c2, c3];

  /* ---------- BAR 2 : league names ---------- */
  G.lgY = 1365;
  mkClip('lgClip', 0, G.lgY - 175, 1080, 350);
  G.lgG = S('g', { 'clip-path': 'url(#lgClip)' }, root);
  const LG = [['PREMIER LEAGUE'], ['LIGA MX'], ['CHAMPIONS LEAGUE'], ['LALIGA'], ['+120', ' LIGAS']];
  G.lg = LG.map((parts, i) => {
    const str = parts.join('');
    const j = justify(str, X0, TW);
    const g = S('g', {}, G.lgG);
    const tx = S('text', { x: 0, y: 0, 'font-size': 100, fill: WHITE }, g);
    parts.forEach((p, k) => S('tspan', { fill: (i === 4 && k === 0) ? BLUE : WHITE }, tx, p));
    tx.setAttribute('xml:space', 'preserve'); tx.style.whiteSpace = 'pre';
    return { g, j, cap: CAP * j.fs, t0: 2.0 + 0.5 * i };
  });
  G.baseline = S('rect', { x: 230, y: 1148, width: 620, height: 4, fill: 'rgba(255,255,255,0.3)' }, root);

  /* ---------- morph shapes (bars <-> stripes <-> columns) ---------- */
  G.m = [0, 1, 2].map(i => S('path', { fill: WHITE }, root));
  // bar-1 redaction bars (full) -> shield stripes (big, bar 2)
  G.S2 = { cx: 540 - 1.25 * (371.5 - LOGO_C[0]), cy: 780 - 1.25 * (567.5 - LOGO_C[1]), s: 1.25 };
  G.stripes2 = STRIPES_LOGO.map(P => mapLogo(P, G.S2.cx, G.S2.cy, G.S2.s));
  const ov = 0.03;
  G.redBars = [0, 1, 2].map(i => {
    const top = [G.topD, G.topD + c1 + G.gap, G.topD + c1 + c2 + 2 * G.gap][i], c = G.c[i];
    return { x: X0 - 4, y: top - ov * c, w: TW + 8, h: c * (1 + 2 * ov) };
  });
  G.morph1 = [0, 1, 2].map(i => { const b = G.redBars[i]; return makeMorph(rectPoly(b.x, b.y, b.w, b.h), G.stripes2[i], -Math.PI / 2, 180); });
  // columns
  G.colX = [320, 540, 760]; G.colW = 130; G.colB = 1150;
  G.DATA = [[520, 690, 600], [640, 560, 720], [560, 740, 480], [610, 760, 680]];
  G.colRect = (i, h) => rectPoly(G.colX[i] - G.colW / 2, G.colB - h, G.colW, h);
  G.morph2 = [0, 1, 2].map(i => makeMorph(G.stripes2[i], G.colRect(i, G.DATA[0][i]), 0, 180));

  /* ---------- BAR 3 : 3D world ---------- */
  const world = $('world');
  G.floor = D(world, { left: '230px', top: '1148px', width: '620px' }); G.floor.id = 'floor';
  const shadeX = 'rgb(41,91,172)', shadeTop = 'rgb(50,111,209)';
  G.boxes = [0, 1, 2].map(i => {
    const b = D(world, {}, null, 'box');
    const fr = D(b, { background: WHITE }, null, 'f');
    const tp = D(b, { background: shadeTop }, null, 'f');
    const bt = D(b, { background: BLUE }, null, 'f');
    const lf = D(b, { background: shadeX }, null, 'f');
    const rt = D(b, { background: shadeX }, null, 'f');
    return { b, fr, tp, bt, lf, rt };
  });
  G.P3 = [540, 810];
  // track geometry (screen, bar 4) and its inverse in world space (after the 90° camera roll)
  G.ROW0 = 600; G.ROWD = 176;
  G.trackY = [0, 1, 2].map(i => G.ROW0 + i * G.ROWD + 100);
  G.trackX0 = 110; G.trackLen = 860; G.trackH = 16;
  G.worldTrack = i => { // world rect for track i: vertical bar
    const yc = G.trackY[i] + G.trackH / 2;
    const xc = G.P3[0] + (yc - G.P3[1]);
    const yTop = G.P3[1] - (G.trackX0 + G.trackLen - G.P3[0]); // screen right end -> world top
    return { x: xc - G.trackH / 2, y: yTop, w: G.trackH, h: G.trackLen };
  };

  /* ---------- BAR 4 : app UI (HTML/CSS) ---------- */
  buildUI();

  /* ---------- BAR 5 : end card ---------- */
  G.end = S('g', {}, root);
  G.endZ = S('g', {}, G.end);
  G.endT = S('g', {}, G.endZ);
  const sp = LOGO_SUBPATHS;
  G.ringExact = S('path', { d: [sp[1], sp[2], sp[3], sp[4], sp[5]].join(''), fill: WHITE, 'fill-rule': 'evenodd' }, G.endT);
  mkClip('crownClip', 0, -200, 733, 200 + 176);
  const crownWrap = S('g', { 'clip-path': 'url(#crownClip)' }, G.endT);

function seek(tIn) {
  const t = ((tIn % DUR) + DUR) % DUR;
  FX.setTransform(1, 0, 0, 1, 0, 0); FX.clearRect(0, 0, W, H);

}

/* ---------- BAR 1 ---------- */
const font1 = t => lerp(G.jGOL.fs, G.jL1.fs, spring(t, 0.5, 26));
const L1top = t => G.topA + (G.topB - G.topA) * spring(t, 0.5, 26) + (G.topC - G.topB) * spring(t, 0.75, 28) + (G.topD - G.topC) * spring(t, 1.0, 28);
const golScale = t => t < 0.055 ? 1.8 : lerp(1.8, 1, expoOut(prog(t, 0.055, 0.24)));
const esOff = t => 760 * (1 - expoOut(prog(t, 0.5, 0.26)));
const alOff = t => G.c[1] * 1.15 * (1 - expoOut(prog(t, 0.75, 0.26)));
const inOff = t => 1180 * (1 - expoOut(prog(t, 1.0, 0.24)));
const cntExit = t => -130 * expoIn(prog(t, 1.0, 0.14));

function renderBar1(t) {
  const on = t >= 0.055 && t < M1_T0;
  sshow(G.t1, on);
  for (let i = 0; i < 3; i++) sshow(G.m[i], false);
  if (t >= 1.5 && t < 2.0) renderMorph1(t);
  if (!on) return;
  const fs = font1(t), top = L1top(t), base = top + CAP * fs;
  // GOL / GOLES line
  const sc = golScale(t);
  const xG = X0f() + G.jGOL.m.aL * fs / 100;
  // slam scales about the word centre
  const cxw = X0f() + 450, cyw = top + CAP * fs / 2;
  const gx = cxw + (xG - cxw) * sc, gy = cyw + (base - cyw) * sc;
  G.gGOL.setAttribute('transform', `translate(${gx.toFixed(2)} ${gy.toFixed(2)}) scale(${(fs / 100 * sc).toFixed(4)})`);
  const slamV = vel(golScale, t) * 500;
  blurSVG(G.gGOL, 'fGOL', mb(slamV, 0.003, 9), mb(slamV, 0.003, 9));
  G.wipeRect.setAttribute('width', (1.1 * expoOut(prog(t, 0.5, 0.14))).toFixed(4));
  // ES
  sshow(G.gES, t >= 0.5);
  if (t >= 0.5) {
    const ex = xG + G.advGOL * fs / 100 + esOff(t);
    G.gES.setAttribute('transform', `translate(${ex.toFixed(2)} ${base.toFixed(2)}) scale(${(fs / 100).toFixed(4)})`);
    blurSVG(G.gES, 'fES', mb(vel(esOff, t)), 0);
  }
  // live counter (63' -> 67' on 16ths), attached above line 1, exits at 1.0
  sshow(G.cntAnchor, t < 1.16);
  if (t < 1.16) {
    const cs = golScale(t);
    G.cntAnchor.setAttribute('transform', `translate(0 ${(top - 46 - (cs - 1) * 120).toFixed(2)})`);
    G.cntRoll.setAttribute('transform', `translate(0 ${cntExit(t).toFixed(2)})`);
    const ticks = [0.125, 0.25, 0.375, 0.5];
    let n = 0; for (const k of ticks) if (t >= k) n++;
    const r = n ? expoOut(prog(t, ticks[n - 1], 0.09)) : 1;
    G.cntA.textContent = (63 + Math.max(0, n - 1)) + "'";
    G.cntB.textContent = (63 + n) + "'";
    G.cntA.setAttribute('y', (-86 * r).toFixed(2)); sshow(G.cntA, n > 0 && r < 1);
    G.cntB.setAttribute('y', (86 * (1 - r)).toFixed(2));
    const rv = n ? 86 * vel(tt => expoOut(prog(tt, ticks[n - 1], 0.09)), t) : 0;
    blurSVG(G.cntRoll, 'fCNT', 0, mb(rv, 0.004, 14) + mb(vel(cntExit, t), 0.004, 20));
  }
  // AL
  sshow(G.alAnchor, t >= 0.75);
  if (t >= 0.75) {
    const top2 = top + CAP * fs + G.gap;
    G.alAnchor.setAttribute('transform', `translate(0 ${top2.toFixed(2)})`);
    G.gAL.setAttribute('transform', `translate(${G.jAL.x.toFixed(2)} ${(G.c[1] + alOff(t)).toFixed(2)}) scale(${(G.jAL.fs / 100).toFixed(4)})`);
    blurSVG(G.gAL, 'fAL', 0, mb(vel(alOff, t)));
  }
  // INSTANTE
  sshow(G.gIN, t >= 1.0);
  if (t >= 1.0) {
    const top3 = top + CAP * fs + G.gap + G.c[1] + G.gap;
    G.gIN.setAttribute('transform', `translate(${(G.jIN.x + inOff(t)).toFixed(2)} ${(top3 + G.c[2]).toFixed(2)}) scale(${(G.jIN.fs / 100).toFixed(4)})`);
    blurSVG(G.gIN, 'fINST', mb(vel(inOff, t), 0.0045, 45), 0);
  }
  // text disappears once the redaction bars fully cover it

}
const X0f = () => 90;

// redaction sweep (1.64–1.78) then rotate-morph bars -> shield stripes (1.78–2.0)
const RED_T = [1.5, 1.58, 1.66], M1_T0 = 1.76;
const m1p = t => expoInOut(prog(t, M1_T0, 2.0 - M1_T0));
function renderMorph1(t) {
  for (let i = 0; i < 3; i++) {
    const el = G.m[i]; sshow(el, true);
    if (t < M1_T0) {
      const b = G.redBars[i];
      const w = b.w * expoOut(prog(t, RED_T[i], 0.08));
      sshow(el, w > 0.5);
      el.setAttribute('d', pathOf(rectPoly(b.x, b.y, w, b.h)));
      el.removeAttribute('filter');
    } else sshow(el, false);
  }
  if (t >= M1_T0) smear(t, (ctx, tk) => { ctx.fillStyle = WHITE; for (let i = 0; i < 3; i++) { fillPoly(ctx, morphAt(G.morph1[i], m1p(tk))); ctx.fill(); } });
}

/* ---------- BAR 2 ---------- */
const colH = (i, t) => { let h = G.DATA[0][i]; for (let k = 1; k < 4; k++) h += (G.DATA[k][i] - G.DATA[k - 1][i]) * spring(t, 2.5 + 0.5 * k, 24); return h; };
const m2p = t => expoOut(prog(t, 2.5, 0.3));
const lgOff = (i, t) => { // slot-reel offset of league i
  const tin = G.lg[i].t0, tout = i < 4 ? G.lg[i].t0 + 0.5 : 4.5;
  const ein = 300 * (1 - expoOut(prog(t, tin, 0.26)));
  const eout = -300 * expoOut(prog(t, tout, 0.26));
  return ein + eout;
};
function renderBar2(t) {
  // shapes 2.0 – 4.0
  if (t >= 2.0 && t < 4.0) {
    for (let i = 0; i < 3; i++) {

      else P = G.colRect(i, colH(i, t));
      el.setAttribute('d', pathOf(P));
    }
  }

  sshow(G.baseline, blOn);
  if (blOn) { const w = 620 * expoOut(prog(t, 2.0, 0.3)); G.baseline.setAttribute('x', (540 - w / 2).toFixed(2)); G.baseline.setAttribute('width', w.toFixed(2)); }
  // league names
  const lgOn = t >= 2.0 && t < 4.8;
  sshow(G.lgG, lgOn);
  if (lgOn) G.lg.forEach((L, i) => {
    const vis = t >= L.t0 && t < (i < 4 ? L.t0 + 0.8 : 4.8);
    sshow(L.g, vis);
    if (!vis) return;
    const off = lgOff(i, t);

/* ---------- BAR 3 : 2D -> 3D, one camera move ---------- */
const camP = t => cubicInOut(prog(t, 4.0, 2.0));
const depth = t => 150 * spring(t, 4.0, 20) + 110 * spring(t, 4.5, 22) + 110 * spring(t, 5.0, 22) + 130 * spring(t, 5.5, 22);
const flat = t => 1 - expoIn(prog(t, 5.68, 0.32));      // extrusion collapses into the drop
const resolveP = t => expoIn(prog(t, 5.62, 0.38));      // columns -> track geometry
function renderBar3(t) {
  const on = t >= 4.0 && t < 6.0;
  show($('persp'), on);
  if (!on) return;
  const p = camP(t);
  const roll = 90 * p, tilt = 56 * Math.pow(Math.sin(Math.PI * p), 1.15), sc = 1 - 0.05 * Math.sin(Math.PI * p);
  const dy = 200 * Math.sin(Math.PI * p), dx = -20 * Math.sin(Math.PI * p);
  const [Px, Py] = G.P3;
  $('world').style.transform = `translate(${(Px + dx).toFixed(2)}px,${(Py + dy).toFixed(2)}px) rotateX(${tilt.toFixed(3)}deg) rotateZ(${roll.toFixed(3)}deg) scale3d(${sc.toFixed(4)},${sc.toFixed(4)},${sc.toFixed(4)}) translate(${-Px}px,${-Py}px)`;
  const mult = [0.78, 1.0, 0.9];
  const rp = resolveP(t), fl = flat(t);
  G.boxes.forEach((B, i) => {
    const h0 = colH(i, t);
    const a = { x: G.colX[i] - G.colW / 2, y: G.colB - h0, w: G.colW, h: h0 };
    const b = G.worldTrack(i);
    const x = lerp(a.x, b.x, rp), y = lerp(a.y, b.y, rp), w = lerp(a.w, b.w, rp), h = lerp(a.h, b.h, rp);
    const Dp = depth(t) * mult[i] * fl;
    B.b.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`;
    Object.assign(B.fr.style, { width: w + 'px', height: h + 'px', transform: `translateZ(${Dp.toFixed(2)}px)` });
    const sideOn = Dp > 0.5;
    [B.tp, B.bt, B.lf, B.rt].forEach(e => show(e, sideOn));
    if (sideOn) {
      Object.assign(B.tp.style, { width: w + 'px', height: Dp + 'px', transform: 'rotateX(90deg)' });
      Object.assign(B.bt.style, { width: w + 'px', height: Dp + 'px', transform: `translateY(${h}px) rotateX(90deg)` });
      Object.assign(B.lf.style, { width: Dp + 'px', height: h + 'px', transform: 'rotateY(-90deg)' });
      Object.assign(B.rt.style, { width: Dp + 'px', height: h + 'px', transform: `translateX(${w}px) rotateY(-90deg)` });
    }
  });
  const fw = 1 - expoIn(prog(t, 5.45, 0.25));
  show(G.floor, fw > 0.001);
  G.floor.style.transform = `scaleX(${fw.toFixed(4)})`;
}

};
