  // news card slides in on 7.5

  G.news.style.transform = `translateX(${newsOff(t).toFixed(2)}px)`;
  blurHTML(G.news, 'fNEWS', mb(vel(newsOff, t), 0.0045, 40), 0);
  // tab bar rises in, indicator moves to "Noticias" on 7.5
  const tp = expoOut(prog(t, 6.1, 0.34));
  G.tab.style.transform = `translateY(${(260 * (1 - tp)).toFixed(2)}px)`;
  const ip = expoOut(prog(t, 7.5, 0.3));
  const ix = lerp(G.tabX[0], G.tabX[2], ip);
  G.tabInd.style.left = (ix - 28) + 'px';
  G.icons.forEach((ic, i) => { const active = (t >= 7.5 ? 2 : 0) === i; ic.style.color = active ? WHITE : 'rgba(255,255,255,0.35)'; });
}

/* ---------- BAR 5 : end title (and t=0 loop frame) ---------- */
function drawEndCardCanvas(ctx, ps) {
  const [ox, oy] = G.punchO, M = endMatrix(DUR);
  ctx.setTransform(ps, 0, 0, ps, ox - ps * ox, oy - ps * oy);
  ctx.save(); ctx.transform(M.s, 0, 0, M.s, M.e, M.f);
  ctx.fillStyle = WHITE; ctx.fill(G.p2Ring, 'evenodd'); ctx.fill(G.p2Crown);
  G.p2Stripes.forEach(p => ctx.fill(p));
  ctx.fillStyle = NAVY; ctx.fillRect(56, 446.6, 634, 170.3);
  ctx.fillStyle = WHITE; ctx.fill(G.p2Rules); ctx.fill(G.p2Letters, 'evenodd');
  ctx.restore();
  ctx.font = '800 66px Montserrat'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  G.TAG.forEach((parts, i) => {
    const w0 = ctx.measureText(parts[0]).width, w = ctx.measureText(parts[0] + parts[1]).width, x = 540 - w / 2;
    ctx.fillStyle = WHITE; ctx.fillText(parts[0], x, G.tagY[i]);
    ctx.fillStyle = BLUE; ctx.fillText(parts[1], x + w0, G.tagY[i]);
  });
}
const endP = t => expoOut(prog(t, 8.0, 0.45));
const crownOff = t => 170 * (1 - expoOut(prog(t, 8.2, 0.3)));
const tagOff = (i, t) => 92 * (1 - expoOut(prog(t, 8.5 + 0.5 * i, 0.3)));
const PUNCH_T0 = 1 / 120, PUNCH_D = 0.085;
const punch = t => Math.exp(Math.log(30) * Math.pow(prog(t, PUNCH_T0, PUNCH_D), 2));
function renderEnd(tIn) {
  const inPunch = tIn < PUNCH_T0 + PUNCH_D;
  const on = tIn >= 8.0 || inPunch;
  const punching = inPunch && tIn > PUNCH_T0;
  sshow(G.end, on && !punching);
  if (punching) { smear(tIn, (ctx, tk) => drawEndCardCanvas(ctx, punch(tk)), 24); return; }
  if (!on) return;
  const t = inPunch ? DUR : tIn;
  // punch-through at the loop point
  G.end.removeAttribute('transform'); G.end.removeAttribute('filter');
  const M = endMatrix(t);
  const z = endZoom(t);
  G.endT.setAttribute('transform', `matrix(${M.s} 0 0 ${M.s} ${M.e} ${M.f})`);
  G.tag.setAttribute('transform', `translate(${ENDZ_ORIGIN[0]} ${ENDZ_ORIGIN[1]}) scale(${z}) translate(${-ENDZ_ORIGIN[0]} ${-ENDZ_ORIGIN[1]})`);
  const p = endP(t);
  const morphing = p < 1;
  // ring
  sshow(G.ringExact, !morphing); sshow(G.ringMorph, false);
  G.stripesExact.forEach(e => sshow(e, !morphing));
  G.eMorph.forEach(e => sshow(e, false));
  if (morphing) {
    // card border -> shield frame, stat bars rotate back into the stripes (smeared along their path)
    const mms = [0, 1, 2].map(i => makeMorph(G.trackRects[i], applyM(M, STRIPES_LOGO[i]), -Math.PI / 2, 160));
    smear(t, (ctx, tk) => {
      const pk = endP(tk), Mk = endMatrix(tk);
      const oT = applyM(Mk, G.ringOutL), iT = applyM(Mk, G.ringInL);
      ctx.fillStyle = WHITE;
      ctx.beginPath();
      [[G.cardOut, oT], [G.cardIn, iT]].forEach(([A, B]) => {
        ctx.moveTo(lerp(A[0][0], B[0][0], pk), lerp(A[0][1], B[0][1], pk));
        for (let k = 1; k < A.length; k++) ctx.lineTo(lerp(A[k][0], B[k][0], pk), lerp(A[k][1], B[k][1], pk));
        ctx.closePath();
      });
      ctx.fill('evenodd');
      mms.forEach(mm => { fillPoly(ctx, morphAt(mm, pk)); ctx.fill(); });
    });
  }
  // crown rises out of the frame
  sshow(G.crown, t >= 8.2);
  G.crown.setAttribute('transform', `translate(0 ${crownOff(t).toFixed(2)})`);
  // band stamps across on 8.5
  G.bandClipRect.setAttribute('width', (634 * expoOut(prog(t, 8.5, 0.2))).toFixed(2));
  // tagline, one phrase per beat
  G.tags.forEach((g, i) => {
    const vis = t >= 8.5 + 0.5 * i;
    sshow(g, vis);
    g.setAttribute('transform', `translate(0 ${tagOff(i, t).toFixed(2)})`);
    blurSVG(g, 'fTG' + i, 0, mb(vel(tt => tagOff(i, tt), t), 0.0045, 20));
  });
}

/* =====================================================================
   SOUNDTRACK — Web Audio API, rendered offline (deterministic, seeded)
   120 BPM: kick every beat, hit on every scene change, riser into bar 4,
   crowd-like swell on the goal hook.
   ===================================================================== */
window.renderAudio = async function () {
  const SR = 48000, LOOKAHEAD = 0.006; // DynamicsCompressorNode pre-delay, trimmed below
  const NS = Math.round(SR * (DUR + LOOKAHEAD));
  const ctx = new OfflineAudioContext(2, NS, SR);
  let seed = 0x5EED1234;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const NB = (() => { const b = ctx.createBuffer(2, SR * 3, SR); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; } return b; })();
  const master = ctx.createGain(); master.gain.value = 0.85;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.16;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver();
  const ir = ctx.createBuffer(2, Math.floor(SR * 1.6), SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 4) * 0.5; }
  verb.buffer = ir; const vsend = ctx.createGain(); vsend.gain.value = 0.28; vsend.connect(verb); verb.connect(master);

  const env = (g, t, peak, a, d, curve = 'exp') => {
    g.gain.setValueAtTime(0.0001, Math.max(0, t));
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    else g.gain.linearRampToValueAtTime(0, t + a + d);
  };
  const out = (node, send = 0, pan = 0) => {
    const p = ctx.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(master);
    if (send) { const s = ctx.createGain(); s.gain.value = send; p.connect(s); s.connect(vsend); }
  };
  const noiseSrc = (t, dur) => { const s = ctx.createBufferSource(); s.buffer = NB; s.start(t, (rnd() * 1.5), dur + 0.05); return s; };
  const filt = (type, f, Q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };

  function kick(t, v = 1) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.07); o.frequency.exponentialRampToValueAtTime(42, t + 0.32);
    const g = ctx.createGain(); env(g, t, 0.95 * v, 0.002, 0.42); o.connect(g); out(g); o.start(t); o.stop(t + 0.5);
    const n = noiseSrc(t, 0.02), hp = filt('highpass', 3000), gn = ctx.createGain(); env(gn, t, 0.18 * v, 0.001, 0.015);
    n.connect(hp); hp.connect(gn); out(gn);
  }
  function hat(t, v = 0.12, len = 0.035, pan = 0.15) {
    const n = noiseSrc(t, len + 0.02), hp = filt('highpass', 8000), g = ctx.createGain(); env(g, t, v, 0.001, len);
    n.connect(hp); hp.connect(g); out(g, 0.05, pan);
  }
  function snare(t, v = 0.4, f = 1700) {
    const n = noiseSrc(t, 0.25), bp = filt('bandpass', f, 0.8), g = ctx.createGain(); env(g, t, v, 0.001, 0.16);
    n.connect(bp); bp.connect(g); out(g, 0.35);
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(210, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    const go = ctx.createGain(); env(go, t, v * 0.5, 0.001, 0.08); o.connect(go); out(go); o.start(t); o.stop(t + 0.15);
  }
  function hit(t, v = 1) {
    const n = noiseSrc(t, 0.9), lp = filt('lowpass', 9000, 0.9);
    lp.frequency.setValueAtTime(9000, t); lp.frequency.exponentialRampToValueAtTime(250, t + 0.6);
    const g = ctx.createGain(); env(g, t, 0.55 * v, 0.002, 0.7); n.connect(lp); lp.connect(g); out(g, 0.6);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.8);
    const go = ctx.createGain(); env(go, t, 0.8 * v, 0.003, 0.9); o.connect(go); out(go); o.start(t); o.stop(t + 1);
    // short minor stab (A minor) through a closing filter
    const lp2 = filt('lowpass', 3200, 2); lp2.frequency.setValueAtTime(3200, t); lp2.frequency.exponentialRampToValueAtTime(380, t + 0.35);
    const gs = ctx.createGain(); env(gs, t, 0.09 * v, 0.003, 0.42); lp2.connect(gs); out(gs, 0.5);
    [110, 220, 261.63, 329.63].forEach((f, k) => { [-6, 6].forEach(dt => { const s = ctx.createOscillator(); s.type = 'sawtooth'; s.frequency.value = f; s.detune.value = dt + k; s.connect(lp2); s.start(t); s.stop(t + 0.5); }); });
  }
  function tick(t, f = 2600, v = 0.12) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); env(g, t, v, 0.001, 0.035); o.connect(g); out(g, 0.15, 0.2); o.start(t); o.stop(t + 0.06);
  }
  function blip(t, f = 1320, v = 0.1) {
    [f, f * 1.5].forEach((ff, k) => { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = ff; const g = ctx.createGain(); env(g, t + k * 0.04, v, 0.002, 0.09); o.connect(g); out(g, 0.25, k ? 0.25 : -0.25); o.start(t + k * 0.04); o.stop(t + k * 0.04 + 0.15); });
  }
  function whoosh(t, dur = 0.18, f0 = 600, f1 = 4500, v = 0.22, pan = 0) {
    const n = noiseSrc(t, dur + 0.05), bp = filt('bandpass', f0, 1.2);
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur * 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(bp); bp.connect(g); out(g, 0.2, pan);
  }
  function bass(t, f, len = 0.2, v = 0.2) {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = f / 2;
    const lp = filt('lowpass', 900, 5); lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(220, t + len);
    const g = ctx.createGain(); env(g, t, v, 0.004, len);
    o.connect(lp); o2.connect(lp); lp.connect(g); out(g); o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
  }
  function crowd(t0, peak, att, hold, rel) {
    const end = t0 + att + hold + rel;
    // slow random amplitude movement so it breathes like many voices
    const lfo = ctx.createBuffer(1, Math.ceil(SR * (end - t0 + 0.1)), SR);
    { const d = lfo.getChannelData(0); let a = 0.8, b = 0.8; const step = Math.floor(SR / 9);
      for (let i = 0; i < d.length; i++) { if (i % step === 0) { a = b; b = 0.55 + rnd() * 0.45; } const u = (i % step) / step; d[i] = a + (b - a) * (u * u * (3 - 2 * u)); } }
    const ls = ctx.createBufferSource(); ls.buffer = lfo;
    const am = ctx.createGain(); am.gain.value = 0; ls.connect(am.gain);
    const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, t0); e.gain.exponentialRampToValueAtTime(peak, t0 + att);
    e.gain.setValueAtTime(peak, t0 + att + hold); e.gain.exponentialRampToValueAtTime(0.0001, end);
    [[320, 0.9, 1.0], [700, 1.1, 0.85], [1250, 1.3, 0.55], [2600, 1.6, 0.25]].forEach(([f, Q, v]) => {
      const n = noiseSrc(t0, end - t0 + 0.05), bp = filt('bandpass', f, Q);
      bp.frequency.setValueAtTime(f * 0.85, t0); bp.frequency.exponentialRampToValueAtTime(f * 1.12, t0 + att + hold);
      const g = ctx.createGain(); g.gain.value = v; n.connect(bp); bp.connect(g); g.connect(am);
    });
    am.connect(e); out(e, 0.45);
    ls.start(t0); ls.stop(end + 0.05);
  }

  const B = BEAT;
  // kick on every beat
  for (let k = 0; k < 20; k++) kick(k * B, k === 12 ? 1.1 : (k >= 8 && k < 12 ? 0.85 : 1));
  // scene-change hits
  [0, 2, 4, 6, 8].forEach(t => hit(t, t === 6 ? 1.15 : (t === 0 ? 1.05 : 0.8)));
  // goal hook: crowd swell + minute ticks
  crowd(0.0, 0.55, 0.16, 0.35, 1.25);
  [0.125, 0.25, 0.375, 0.5].forEach((t, i) => tick(t, 2400 + i * 120));
  // bar 1 type moves
  whoosh(0.46, 0.14, 900, 5000, 0.18, 0.3); snare(0.75, 0.32); whoosh(0.96, 0.12, 700, 6000, 0.24, -0.3);
  [1.5, 1.625, 1.75].forEach((t, i) => whoosh(t, 0.08, 2000, 7000, 0.12, -0.3 + 0.3 * i));
  whoosh(1.8, 0.2, 500, 3000, 0.2);
  // groove: offbeat hats + bass (A | F G | riser | A F G | F G)
  const bassNotes = { 0: 110, 1: 110, 2: 110, 3: 110, 4: 87.31, 5: 87.31, 6: 98, 7: 98, 12: 110, 13: 110, 14: 87.31, 15: 98, 16: 87.31, 17: 87.31, 18: 98, 19: 98 };
  for (let k = 0; k < 20; k++) {
    if (k >= 8 && k < 12) continue;
    hat(k * B + 0.25, 0.11);
    if (bassNotes[k]) bass(k * B + 0.25, bassNotes[k], 0.2, 0.17);
  }

  for (let k = 4; k <= 8; k++) { tick(k * B, 1800 + (k - 4) * 220, 0.1); whoosh(k * B - 0.02, 0.12, 1200, 5000, 0.08, 0); }

    const t0 = 4.0, t1 = 5.985;
    const n = noiseSrc(t0, 2.05), bp = filt('bandpass', 300, 2.2);
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(7500, t1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.02, t0); g.gain.exponentialRampToValueAtTime(0.5, t1); g.gain.linearRampToValueAtTime(0, 6.0);
    n.connect(bp); bp.connect(g); out(g, 0.3);
    const lp = filt('lowpass', 400, 3); lp.frequency.setValueAtTime(400, t0); lp.frequency.exponentialRampToValueAtTime(6000, t1);
    const gs = ctx.createGain(); gs.gain.setValueAtTime(0.012, t0); gs.gain.exponentialRampToValueAtTime(0.14, t1); gs.gain.linearRampToValueAtTime(0, 6.0);
    lp.connect(gs); out(gs, 0.2);
    [-9, 9].forEach(dt => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = dt; o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(880, t1); o.connect(lp); o.start(t0); o.stop(6.0); });
    // snare roll accelerating: 8ths -> 16ths -> 32nds
    const roll = [];
    for (let t = 4.0; t < 5.0 - 1e-6; t += 0.25) roll.push(t);
    for (let t = 5.0; t < 5.5 - 1e-6; t += 0.125) roll.push(t);
    for (let t = 5.5; t < 6.0 - 1e-6; t += 0.0625) roll.push(t);
    roll.forEach(t => snare(t, 0.1 + 0.36 * Math.pow((t - 4) / 2, 1.3), 1500 + 1500 * ((t - 4) / 2)));
  }
  // bar 4: UI blips on every stat, goal, news
  blip(6.0, 1320); blip(6.5, 1480); blip(7.0, 1660); 
  crowd(7.0, 0.28, 0.1, 0.25, 0.8); snare(7.0, 0.35);
  whoosh(7.48, 0.2, 800, 5000, 0.2, 0.4);
  for (let k = 0; k < 16; k++) if (k % 4 !== 2) hat(6.0 + k * 0.125, 0.05, 0.02, -0.2);
  // bar 5: band stamp + tagline
  snare(8.5, 0.4, 1300); tick(9.0, 1760, 0.1); tick(9.5, 1975, 0.1); whoosh(8.18, 0.25, 400, 2500, 0.15);

  const buf = await ctx.startRendering();
  // normalise to -1 dBFS and encode 16-bit WAV
  const off = Math.round(SR * LOOKAHEAD), NOUT = SR * DUR;
  const L = buf.getChannelData(0).subarray(off, off + NOUT), R = buf.getChannelData(1).subarray(off, off + NOUT);
  let pk = 0; for (let i = 0; i < L.length; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
  const gN = Math.pow(10, -1 / 20) / (pk || 1);
  const bytes = new ArrayBuffer(44 + L.length * 4), dv = new DataView(bytes);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); dv.setUint32(4, 36 + L.length * 4, true); wstr(8, 'WAVE'); wstr(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true);
  dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); wstr(36, 'data'); dv.setUint32(40, L.length * 4, true);
  for (let i = 0, o = 44; i < L.length; i++, o += 4) {
    dv.setInt16(o, Math.max(-32767, Math.min(32767, Math.round(L[i] * gN * 32767))), true);
    dv.setInt16(o + 2, Math.max(-32767, Math.min(32767, Math.round(R[i] * gN * 32767))), true);
  }
  const u8 = new Uint8Array(bytes); let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(bin), peak: pk };
};

build();
